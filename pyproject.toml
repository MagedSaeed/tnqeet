[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tnqeet"
# Version is derived from the latest git tag by setuptools-scm; see
# [tool.setuptools_scm] below. Release by tagging vX.Y.Z — do not hardcode here.
dynamic = ["version"]
description = "Arabic text diacritization (dotting) library: restoring dots to undotted Arabic Rasm."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Maged Saeed", email = "mageedsaeed1@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarabic~=0.6",
    "datasets~=3.6",
    "python-dotenv~=1.1",
    "jiwer~=3.1",
    "dspy~=2.6",
    "tabulate~=0.9",
    "sentencepiece~=0.2",
    "transformers[torch]~=4.52",
    "pytorch-lightning>=2.6.0",
    "torchmetrics>=1.8.2",
    "scikit-learn>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/MagedSaeed/tnqeet"
Repository = "https://github.com/MagedSaeed/tnqeet"

[project.optional-dependencies]
# Backend selection for torch (pick exactly one):
#   cuda  -> CUDA wheels, pulls nvidia-* packages (this is also the default)
#   cpu   -> CPU-only wheels, no nvidia-* packages
# See the README for the exact install commands.
cpu = [
    "torch>=2.6.0",
]
cuda = [
    "torch>=2.6.0",
]
dev = [
    "ruff",
    "mypy>=1.0,<2.0",
    "black>=23.0,<25.0",
    "isort>=5.12,<5.14",
    "pytest",
    "pytest-cov",
    # Training / evaluation / visualization tooling. Not needed to use the
    # published dotters (inference); only for training models and running the
    # notebooks and eval scripts from a repo clone.
    "wandb~=0.20",            # training: pytorch-lightning WandbLogger
    "matplotlib>=3.9.4",      # notebooks / visualization
    "matplotlib-inline>=0.2.1",
    "seaborn~=0.13",          # notebooks / visualization
    "ipython>=8.18.1",        # notebooks
    # kenlm for the n-gram dotter. It compiles from source and is NOT a
    # runtime dependency of the published package — if you want to use
    # n-gram, install kenlm first (see README). Kept here so local
    # dev/eval works via `uv sync`.
    "kenlm",
]

[tool.setuptools.packages.find]
include = ["tnqeet*"]
exclude = [
    "tests*",
    "tnqeet_scripts*",
    "datasets*",
]

[tool.setuptools.package-data]
tnqeet = ["py.typed", "data/fewshot_examples.json"]

[tool.setuptools_scm]
# Version comes from git tags (vX.Y.Z). Untagged commits get a dev version
# like 0.1.1.post1.devN+g<sha>. fallback_version is used when building outside
# a git checkout (e.g. from an sdist that lacks .git).
fallback_version = "0.0.0"

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py39"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.pytest.ini_options]
testpaths = "tests/"
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"

[tool.uv.sources]
kenlm = { git = "https://github.com/kpu/kenlm" }
# torch is resolved from a CPU- or CUDA-specific index depending on which extra
# is active. (uv honors these sources; pip users must pass --extra-index-url for
# the cpu build -- see the README.)
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

# to install kenlm, do not forget to set the MAX_ORDER env variable first to your preferred number (maybe 15 or 20).

# The cpu and cuda extras are mutually exclusive: they install the same torch
# version from different indexes, so they must never be resolved together.
[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
