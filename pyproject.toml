[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tnqeet"
version = "0.1.0"
description = "Arabic text diacritization (dotting) library: restoring dots to undotted Arabic Rasm."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Maged Saeed", email = "mageedsaeed1@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarabic~=0.6",
    "datasets~=3.6",
    "python-dotenv~=1.1",
    "jiwer~=3.1",
    "dspy~=2.6",
    "wandb~=0.20",
    "tabulate~=0.9",
    "seaborn~=0.13",
    "sentencepiece~=0.2",
    "matplotlib-inline>=0.2.1",
    "transformers[torch]~=4.52",
    "pytorch-lightning>=2.6.0",
    "torchmetrics>=1.8.2",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.9.4",
    # TnqeetLM dependencies for LLM fine-tuning
    "peft>=0.14.0",
    "trl>=0.16.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.3.0",
    "ipython>=8.18.1",
]

[project.urls]
Homepage = "https://github.com/MagedSaeed/tnqeet"
Repository = "https://github.com/MagedSaeed/tnqeet"

[dependency-groups]
dev = [
    "ruff",
    "mypy>=1.0,<2.0",
    "black>=23.0,<25.0",
    "isort>=5.12,<5.14",
    "pytest",
    "pytest-cov",
    # kenlm for the n-gram dotter. It compiles from source and is NOT a
    # runtime dependency of the published package — if you want to use
    # n-gram, install kenlm first (see README). Kept here so local
    # dev/eval works via `uv sync`.
    "kenlm",
]

[tool.setuptools.packages.find]
include = ["tnqeet*"]
exclude = [
    "tests*",
    "tnqeet_scripts*",
    "datasets*",
]

[tool.setuptools.package-data]
tnqeet = ["py.typed"]

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 115
target-version = "py39"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false

[tool.pytest.ini_options]
testpaths = "tests/"
python_classes = ["Test*", "*Test"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"

[tool.uv.sources]
kenlm = { git = "https://github.com/kpu/kenlm" }

# To install kenlm, set the MAX_ORDER env variable first to your preferred
# n-gram order (e.g. 15 or 20) before running `uv sync`.
