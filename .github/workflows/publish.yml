name: Publish to PyPI

# Publishes tnqeet to PyPI when a version tag (e.g. v0.1.0) is pushed.
#
# Authenticates with a PyPI API token stored as the repository secret
# PYPI_API_TOKEN (Settings -> Secrets and variables -> Actions). uv reads it
# from UV_PUBLISH_TOKEN and uploads as the implicit "__token__" user.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags so setuptools-scm can derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
